"$schema" = 'https://starship.rs/config-schema.json'

palette = "kanagawa_dragon"

# Segments cascade bg1 -> bg2 -> bg3, angular powerline separators. Each
# module sets its own `style` -- an outer wrapper alone gets overridden by
# the module's own default style. Needs a Nerd Font for the separator/branch
# glyphs.
format = """
[](fg:bg1)$time[](fg:bg1 bg:bg2)$directory[](fg:bg2 bg:bg3)$git_branch[](fg:bg3)
$character"""

right_format = """$cmd_duration"""

add_newline = true

# Same hex as nvim/lua/plugins/kanagawa.lua and tmux/.tmux.conf.
[palettes.kanagawa_dragon]
bg1 = "#1D1C19"     # dragonBlack2
bg2 = "#282727"     # dragonBlack4
bg3 = "#393836"     # dragonBlack5
text = "#c5c9c5"    # dragonWhite
green = "#87a987"   # dragonGreen
red = "#c4746e"     # dragonRed
yellow = "#c4b28a"  # dragonYellow

[time]
disabled = false
style = "bg:bg1 fg:text"
format = "[ $time ]($style)"
time_format = "%H:%M"

[directory]
style = "bg:bg2 fg:text"
format = "[ $path ]($style)"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = ""
style = "bg:bg3 fg:yellow"
format = "[ $symbol$branch ]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[cmd_duration]
min_time = 2_000
style = "bg:bg1 fg:text"
format = "[](fg:bg1)[ $duration ]($style)"
