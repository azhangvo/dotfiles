# Barebones. See BACKLOG.md for candidates to port over from the existing setup.

# tmux-256color (tmux's own terminfo, not xterm-256color) + trust the outer
# terminal's RGB support -- otherwise colors get downsampled to 256. `sync`
# (DEC 2026 synchronized-output) only matters for apps *inside* panes that
# themselves speak the protocol (e.g. to stop their own content tearing) --
# checked tmux's own tty.c: TTYC_SYNC is only emitted when relaying a
# pane's own request, never for tmux's own status-line/prompt drawing. So
# it does NOT fix the status-line "builds up character by character" issue
# (see the `:` rebind below for the actual fix) -- kept here since it's a
# real, harmless feature for iTerm2 (supported since v3.5), just not this.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB:sync"

# Mouse: click to select/resize panes, wheel to scroll. Focus events: lets
# apps inside tmux (e.g. nvim's autoread-on-focus) see terminal focus
# in/out, which they can't otherwise detect through the multiplexer.
set -g mouse on
set -g focus-events on

# Prefix: Ctrl-Space. `send-prefix` also lands in the (built-in) "prefix"
# key table, same as every other prefix-bound command below -- pressing
# C-Space a second time sends a literal C-Space through, tmux's usual
# double-prefix idiom.
unbind-key C-b
set -g prefix C-Space
bind-key C-Space send-prefix
# Enter/q/Escape explicitly back out of prefix mode -- the only way out.
# Any OTHER unbound key still falls through to tmux's default table
# behavior: it gets sent through to the pane and prefix mode drops (a
# tmux table lasts exactly one keypress unless a binding explicitly
# re-enters it, which is what all the sticky binds below do). Making
# literally every possible key swallow-and-stay would mean rebinding the
# entire default prefix table by hand -- out of scope here; ask if that's
# actually wanted before doing it.
bind-key -T prefix Enter switch-client -T root
bind-key -T prefix q switch-client -T root
bind-key -T prefix Escape switch-client -T root

# command-prompt (prefix + :) has a real tmux redraw bug: opening it doesn't
# mark the whole status-line row dirty, so old status-left/right content
# (hostname, clock, etc.) survives and only gets erased under the cursor as
# you type -- confirmed live, character by character. No dedicated tmux
# hook exists for "prompt about to open" to fix this cleanly; forcing a
# full status redraw in the same keychain, right before the prompt opens,
# is the cheapest thing to try. If this doesn't actually clear it (the bug
# may be in command-prompt's own draw call, not the general status-line
# refresh path), the real fix is moving this to a display-popup instead --
# a structurally different overlay type that isn't diffed against the old
# status line the same way.
bind-key : refresh-client -S \; command-prompt

# Splits (cwd-preserving). o/O = above/below, p/P = right/left. Sticky, same
# as resize below -- any command run from the prefix table re-enters it
# instead of reverting to root, so the only way out is the explicit
# Enter/q/Escape above (matches the original ask: prefix is a held mode,
# not a one-shot chord).
bind-key o split-window -v -c "#{pane_current_path}" \; switch-client -T prefix
bind-key O split-window -v -b -c "#{pane_current_path}" \; switch-client -T prefix
bind-key p split-window -h -c "#{pane_current_path}" \; switch-client -T prefix
bind-key P split-window -h -b -c "#{pane_current_path}" \; switch-client -T prefix

# New window (cwd-preserving), t for "tab" -- tmux's own term for this is
# "window", but it's the same mental model as a browser tab.
bind-key t new-window -c "#{pane_current_path}" \; switch-client -T prefix

# Resize (Shift+hjkl). Sticky -- each one re-enters the prefix table
# instead of reverting to root, so C-Space H H H resizes 3 times without
# pressing C-Space again; Enter/q (above) is the explicit way out.
# Deliberately NOT `-r` (tmux's own built-in repeatable-key flag): that
# runs its own independent `repeat-time` timeout (500ms default) that
# reverts to root on its own, racing our manual chain below and causing
# prefix mode to drop early on any pause over 500ms -- confirmed as the
# actual bug, not a guess (H/J/K/L, the only bindings that ever dropped
# early, were also the only ones with `-r`; o/p/t, `-r`-free, never did).
# `-r` is redundant anyway once we chain switch-client -T prefix by hand --
# that alone already gives unlimited-duration stickiness.
bind-key H resize-pane -L 5 \; switch-client -T prefix
bind-key J resize-pane -D 5 \; switch-client -T prefix
bind-key K resize-pane -U 5 \; switch-client -T prefix
bind-key L resize-pane -R 5 \; switch-client -T prefix

# Pane navigation while holding prefix (hjkl, sticky, same pattern as
# resize above). Mirrors the no-prefix Alt+hjkl binds below -- same
# direction keys, just reachable without leaving prefix mode too.
bind-key h select-pane -L \; switch-client -T prefix
bind-key j select-pane -D \; switch-client -T prefix
bind-key k select-pane -U \; switch-client -T prefix
bind-key l select-pane -R \; switch-client -T prefix

# Move between panes (Alt+hjkl, no prefix), switch windows (Ctrl-Alt+h/l or
# Left/Right, no prefix).
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R
bind-key -n C-M-h previous-window
bind-key -n C-M-l next-window
bind-key -n C-M-Left previous-window
bind-key -n C-M-Right next-window

# Kanagawa Dragon palette -- same hex as nvim/lua/plugins/kanagawa.lua and
# starship/.config/starship.toml, kept in sync by hand.
#   dragonBlack2 #1D1C19  dragonBlack4 #282727  dragonBlack5 #393836
#   dragonBlack6 #625e5a  dragonWhite  #c5c9c5  dragonYellow #c4b28a
set -g status-style "bg=#1D1C19,fg=#c5c9c5"

set -g window-status-current-style "bg=#393836,fg=#c4b28a,bold"
# Rightward  separator: fg = color being left, bg = color being entered.
set -g window-status-current-format "#[fg=#1D1C19,bg=#393836]#[fg=#c4b28a,bg=#393836] #I #W #[fg=#393836,bg=#1D1C19]"
set -g window-status-format " #I #W "
set -g window-status-separator ""

# Active pane's border goes dragonRed while the sticky prefix is held --
# alongside the WAIT tag below, but far harder to miss since it's right in
# the middle of your view instead of a small status-bar corner.
set -g pane-border-style "fg=#625e5a"
set -g pane-active-border-style "#{?client_prefix,fg=#c4746e,fg=#c4b28a}"

# message-style: confirm-before prompts (e.g. the default kill-pane 'y/n').
# message-command-style: command-prompt (prefix + :) while typing. Both
# unthemed by default (tmux's own bright yellow/black), which is what made
# them look broken against this dark theme -- explicit here so they render
# like the rest of the bar instead of flashing tmux's stock colors.
#
# bg matches status-style's bg (#1D1C19), not the #393836 segment color --
# tmux draws these directly over the status line and, on some terminals,
# doesn't fully clear-to-end-of-line first (a known class of tmux/terminal
# redraw quirk, e.g. kovidgoyal/kitty#265 "tmux pane switching does not
# clear status line"). Matching the base bg exactly means any leftover
# uncleared cells are the same color as what should be there, so a partial
# clear is invisible instead of showing as a mismatched color block.
set -g message-style "bg=#1D1C19,fg=#c5c9c5"
set -g message-command-style "bg=#1D1C19,fg=#c5c9c5"
set -g mode-style "bg=#1D1C19,fg=#c5c9c5"

set -g display-panes-active-colour "#c4b28a"
set -g display-panes-colour "#625e5a"
set -g clock-mode-colour "#c4b28a"

# status-left/right, tmux-power-inspired. Explicit lengths -- tmux's
# defaults (10/40) truncate a real session name.
set -g status-left-length 60
set -g status-right-length 40
set -g status-left "#{?client_prefix,#[fg=#1D1C19#,bg=#c4746e#,bold] PREFIX #[fg=#c4746e#,bg=#393836#,nobold]#[fg=#c5c9c5#,bg=#393836] #(whoami)@#h #[fg=#393836#,bg=#282727]#[fg=#c5c9c5#,bg=#282727#,bold] #S #[fg=#282727#,bg=#1D1C19],#[fg=#c5c9c5#,bg=#282727] #[fg=#282727#,bg=#393836]#[fg=#c5c9c5#,bg=#393836] #(whoami)@#h #[fg=#393836#,bg=#282727]#[fg=#c5c9c5#,bg=#282727#,bold] #S #[fg=#282727#,bg=#1D1C19]}"
set -g status-right "#[fg=#1D1C19,bg=#282727]#[fg=#c5c9c5,bg=#282727] %a %d %b #[fg=#282727,bg=#393836]#[fg=#c4b28a,bg=#393836,bold] %H:%M "

# TPM (tmux plugin manager). Bootstrapped via git-clone-if-missing, same
# pattern as nvim's own lazy.nvim bootstrap in config/lazy.lua -- no
# package manager involved, works identically on any platform with git.
if-shell "[ ! -d ~/.tmux/plugins/tpm ]" \
  "run-shell 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# continuum autosaves periodically and restores on tmux start -- resurrect
# alone only saves/restores on the manual prefix+Ctrl-s/prefix+Ctrl-r binds.
set -g @continuum-restore 'on'

# Keep this at the very bottom -- TPM's own documented requirement.
run '~/.tmux/plugins/tpm/tpm'
