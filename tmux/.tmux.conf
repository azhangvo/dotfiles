# Barebones. See BACKLOG.md for candidates to port over from the existing setup.

# Truecolor passthrough. Without this, tmux assumes the outer terminal is
# limited to 256 colors and silently downsamples every hex color nvim sends
# -- even when the outer terminal (iTerm2, Ghostty, Kitty, etc.) genuinely
# supports 24-bit RGB. `tmux-256color` is tmux's own terminfo entry (bundled
# since tmux 2.9), the correct `default-terminal` value here -- NOT
# `xterm-256color`, which belongs in the outer shell's env, not tmux.conf.
# `terminal-features ,*:RGB` (tmux 3.2+) tells tmux "treat whatever outer
# terminal you're actually running in as RGB-capable" -- the wildcard avoids
# hardcoding one specific outer terminal name.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Kanagawa Dragon palette (rebelot/kanagawa.nvim) -- same hex values as
# nvim/lua/plugins/kanagawa.lua and starship/.config/starship.toml, kept in
# sync by hand across all three since none of these tools share a config
# format to drive from one source file (tmux.conf has no variables/macros,
# so these are just the literal hex repeated at each use site -- same
# approach zenbones.nvim's own extras/tmux/*.tmux reference files use).
# This only themes tmux's own chrome (status bar, pane borders, messages)
# -- it deliberately doesn't touch prefix key, plugin manager, mouse mode,
# vi-mode, or pane/window keybindings, which are still open decisions, not
# colorscheme work.
#   dragonBlack2 #1D1C19  dragonBlack4 #282727  dragonBlack5 #393836
#   dragonBlack6 #625e5a  dragonWhite  #c5c9c5  dragonViolet #c4b28a

set -g status-style "bg=#1D1C19,fg=#c5c9c5"

# Angular (hard-edged) powerline separators, matching lualine's default
# section_separators and starship's format string -- same glyph family
# (U+E0B0/U+E0B2) everywhere so the three tools read as one visual system.
# Requires a Nerd Font in the terminal; renders as boxes/question marks
# without one.
set -g window-status-current-style "bg=#393836,fg=#c4b28a,bold"
# Powerline convention for a rightward  transition: fg = color being left,
# bg = color being entered (verified against a working reference -- easy to
# get backwards, since the naive reading suggests the opposite).
set -g window-status-current-format "#[fg=#1D1C19,bg=#393836]#[fg=#c4b28a,bg=#393836] #I #W #[fg=#393836,bg=#1D1C19]"
set -g window-status-format " #I #W "
set -g window-status-separator ""

set -g pane-border-style "fg=#625e5a"
set -g pane-active-border-style "fg=#c4b28a"

set -g message-style "bg=#393836,fg=#c5c9c5"
set -g mode-style "bg=#393836,fg=#c5c9c5"

set -g display-panes-active-colour "#c4b28a"
set -g display-panes-colour "#625e5a"
set -g clock-mode-colour "#c4b28a"
